<title>Maintenance Hub · Protótipo (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Caveat:wght@500&display=swap">
<style>
/* Layout: top bar with the four screens of the Hub; each screen fills the window. Transpedrosa blue and orange only. */
:root{
  --navy:#0B3A66; --deep:#072645; --blue:#0A4A80; --orange:#F39200; --orange-soft:#FFF1DC;
  --paper:#F3F6F9; --white:#FFFFFF; --ink:#102133; --body:#4A5B6B; --line:#D6DEE6;
  --green:#2F8A5B; --green-soft:#E3F3EA; --red:#C0432F; --red-soft:#FBE7E3; --amber:#D9831A; --plan:#1D3A57;
  --tv:#0B1724; --tv2:#132536; --tv-ink:#E9F0F7; --tv-soft:#93AAC1;
  --f-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-b:"Barlow","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:16px;min-height:100vh}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--deep);color:#fff;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:20px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--deep);z-index:30}
.brand{display:flex;align-items:center;gap:12px}
.brand .sym{height:34px}.brand .wm{height:18px}
.brand b{font-family:var(--f-d);font-size:22px;letter-spacing:.02em;border-left:1px solid rgba(255,255,255,.25);padding-left:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{background:transparent;border:1px solid rgba(255,255,255,.18);color:#CFE0F0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px}
.tab[aria-selected="true"]{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.clock{font-family:var(--f-d);font-size:22px;color:#CFE0F0;display:flex;gap:10px;align-items:center}
.clock small{font-family:var(--f-b);font-size:12px;opacity:.7}
.reset{background:transparent;border:1px solid rgba(255,255,255,.25);color:#CFE0F0;border-radius:8px;padding:6px 10px;font-size:13px}
.view{padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));max-width:1600px;margin:0 auto}
.hint{background:var(--orange-soft);border-left:5px solid var(--orange);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;color:#5B3A06;margin-bottom:16px}
h1{font-family:var(--f-d);font-size:34px;line-height:1.05}
h2{font-family:var(--f-d);font-size:26px}

/* TV board */
.tvwrap{background:var(--tv);border-radius:18px;padding:18px 20px;color:var(--tv-ink);border:8px solid #1C2C3D}
.tvhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tvhead h1{color:#fff;font-size:30px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--tv2);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--tv-soft)}
.kpi b{color:#fff;font-size:18px;margin-left:4px}
.gridtv{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.timeline{overflow-x:auto}
.tl{min-width:760px}
.hours,.laneb{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center}
.hours .scale{position:relative;height:22px}
.hours .scale span{position:absolute;transform:translateX(-50%);font-size:13px;color:var(--tv-soft)}
.laneb{height:62px}
.laneb .who{font-size:15px;line-height:1.2}.laneb .who small{display:block;color:var(--tv-soft);font-size:13px}
.track{position:relative;height:52px;background:var(--tv2);border-radius:8px}
.job{position:absolute;top:5px;height:42px;border-radius:6px;padding:3px 10px;color:#fff;font-size:13px;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;text-align:left;display:flex;flex-direction:column;justify-content:center}
.job b{font-size:14px}
.job.done{background:#56687A}.job.svc{background:var(--green)}.job.wait{background:var(--amber)}.job.late{background:var(--red)}.job.plan{background:var(--plan);border:2px dashed #7C9BB9}.job.arr{background:#2B5E8E}
.job.sel{outline:3px solid var(--orange)}
.now{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--orange);z-index:2;pointer-events:none}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:6px;background:rgba(255,255,255,.18)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--tv-soft);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--tv2);border-radius:10px;padding:12px 14px}
.panel h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
.panel li{list-style:none;font-size:14px;padding:6px 0;border-top:1px solid rgba(255,255,255,.08)}
.panel li:first-child{border-top:0}
.panel li small{display:block;color:var(--tv-soft)}
.drawer{margin-top:16px;background:var(--white);color:var(--ink);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.drawer h2{font-size:24px}
.life{list-style:none;border-left:3px solid var(--orange);padding-left:14px;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.life li{font-size:14px}.life li b{font-family:var(--f-d);font-size:16px;color:var(--blue);margin-right:6px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:14px;margin-top:6px}
.kv span:nth-child(odd){color:var(--body)}

/* Totem */
.totemlay{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:28px;align-items:start}
.device{background:#0F1E2D;border-radius:28px;padding:18px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.scr{background:var(--white);border-radius:16px;padding:20px;min-height:620px;display:flex;flex-direction:column;gap:12px}
.scr .hd{display:flex;justify-content:space-between;align-items:center}
.scr .hd b{font-family:var(--f-d);font-size:26px;color:var(--blue)}
.mic{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--body)}
.mic i{width:12px;height:12px;border-radius:50%;background:#AAB6C2}
.mic.on{color:var(--red)}.mic.on i{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.meta{font-size:14px;color:var(--body)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--orange);transition:width .4s}
.qcard{background:var(--navy);color:#fff;border-radius:12px;padding:16px 18px}
.qcard small{color:var(--orange);font-weight:700;letter-spacing:.1em;font-size:12px}
.qcard h2{font-family:var(--f-b);font-size:24px;font-weight:700;margin-top:4px}
.qcard p{font-size:13px;color:#BFD2E6;margin-top:4px}
.heard{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;min-height:72px;font-size:16px}
.heard small{display:block;color:var(--body);font-size:12px;margin-bottom:4px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.big{flex:1;min-width:130px;border:0;border-radius:12px;padding:16px 12px;font-weight:700;font-size:18px}
.b-ok{background:var(--green);color:#fff}.b-no{background:var(--red);color:#fff}.b-mic{background:var(--orange);color:var(--ink)}.b-blue{background:var(--blue);color:#fff}.b-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.done-list{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto}
.done-list div{font-size:13px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:3px 0}
.ok{color:var(--green);font-weight:700}.nok{color:var(--red);font-weight:700}
.req{background:var(--green-soft);color:#1E5E3E;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.req.buy{background:var(--orange-soft);color:#6A4205}
.speak{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.speak .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 10px;font-size:13px;text-align:left}
.speak input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
.review li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px}
.review li.doubt{background:var(--orange-soft)}
.explain{display:flex;flex-direction:column;gap:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.card p,.card li{font-size:15px;color:var(--body);line-height:1.45}
.card ul{padding-left:18px}
.pick{display:flex;flex-direction:column;gap:8px}
.pick button{text-align:left;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.pick button b{font-family:var(--f-d);font-size:20px;color:var(--blue);margin-right:8px}

/* almox */
.tbl{width:100%;border-collapse:collapse;background:var(--white);border-radius:12px;overflow:hidden}
.tbl th{background:var(--navy);color:#fff;text-align:left;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.p-pend{background:#E7EEF6;color:var(--blue)}.p-sep{background:var(--orange-soft);color:#7A4A05}.p-ent{background:var(--green-soft);color:#1E5E3E}.p-buy{background:var(--red-soft);color:var(--red)}
.act{border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;background:var(--blue);color:#fff}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.vs .card.old{border-top:5px solid var(--red)}.vs .card.new{border-top:5px solid var(--green)}

/* Rodopar */
.os{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.osgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px}
.f{display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:6px;background:#FFF8D6}
.f span{font-size:11px;color:var(--body);text-transform:uppercase;letter-spacing:.06em}
.f b{font-size:15px}
.f.auto{background:#E8F1FA}
.f.empty b{color:var(--red)}
.items{margin-top:12px}
.empty-state{padding:30px;text-align:center;color:var(--body);background:var(--white);border:1px dashed var(--line);border-radius:12px}
.ttabs{display:flex;gap:6px;background:var(--paper);padding:4px;border-radius:10px}
.ttab{flex:1;border:0;border-radius:8px;padding:10px;font-weight:700;font-size:16px;background:transparent;color:var(--body)}
.ttab[aria-selected="true"]{background:var(--navy);color:#fff}
.pickc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--white);border:1px solid var(--line);border-left:6px solid var(--orange);border-radius:10px;padding:12px 14px}
.pickc b{font-family:var(--f-d);font-size:22px;color:var(--blue)}
.pickc span{font-weight:600}
.pickc small{color:var(--body);font-size:13px}
.pickc:disabled{opacity:.5;cursor:default}
.ok-card{background:var(--green)}
.ok-card small{color:#fff}
.muted{color:#8A99A8}
.sm{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.ospanel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.oshead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:8px}
.oshead h2{font-size:26px;color:var(--ink)}
.grp{font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--orange)}
.block p{font-size:14px;line-height:1.45}
.review li.sect{background:var(--paper);font-weight:700;color:var(--blue);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.review li.cur{outline:2px solid var(--orange)}
.review .code{font-family:var(--f-d);color:var(--blue);margin-right:8px;font-size:15px}
.review li{align-items:flex-start}
.review li > span:last-child{white-space:nowrap;font-size:13px}
.osgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin-top:0}
.tbody{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tlist{list-style:none}
.tlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
.tlist li:last-child{border-bottom:0}
.seg{display:flex;gap:4px;flex-shrink:0}
.sbtn{border:1px solid var(--line);background:var(--white);border-radius:6px;padding:6px 9px;font-size:12px;font-weight:700;color:var(--body)}
.sbtn.on.good{background:var(--green);border-color:var(--green);color:#fff}
.sbtn.on.bad{background:var(--red);border-color:var(--red);color:#fff}
.tmap{padding:10px}
.axles{display:flex;gap:10px;align-items:stretch;overflow-x:auto;padding:6px 0}
.axle{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:120px;position:relative}
.tside{display:flex;flex-direction:column;gap:4px}
.ax{width:6px;height:30px;background:#9AA8B5;border-radius:3px;position:relative}
.ax span{position:absolute;left:12px;top:6px;white-space:nowrap;font-size:11px;color:var(--body);font-weight:700}
.ty{display:flex;justify-content:space-between;gap:8px;background:#1C2C3D;color:#fff;border-radius:6px;padding:5px 9px;font-size:12px;min-width:118px}
.ty i{font-style:normal;color:#9FD3B5;font-weight:700}
.ty.low i{color:var(--orange)}
.ty.nonum{background:#7A4A05}
.was{font-size:10px;color:var(--body);text-align:center;max-width:130px}
.front{writing-mode:vertical-rl;letter-spacing:.3em;font-weight:700;color:var(--body);background:var(--paper);border-radius:6px;padding:6px 4px;font-size:12px}
.extbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.exth{display:flex;flex-direction:column;gap:2px;font-size:14px}
.exth span{color:var(--body);font-size:13px}
.mini{width:100%;border-collapse:collapse;font-size:12px}
.mini th{text-align:left;background:var(--paper);padding:5px 6px;color:var(--body);font-weight:700}
.mini td{padding:4px 6px;border-top:1px solid var(--line)}
.mini td:last-child{text-align:right;white-space:nowrap}
.exttot{font-weight:700;color:var(--blue);font-size:14px;text-align:right}
.handbox{margin-top:8px;background:#FFFEF8;border:1px dashed #D8CFA8;border-radius:8px;padding:8px 10px}
.handc{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:"Caveat",cursive;font-size:24px;color:#1F3F9A}
details{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--white)}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-weight:700;font-size:14px}
summary em{font-style:normal;color:var(--blue)}
details .review{padding:0 6px 6px}
.pad{padding:4px 12px 10px;font-size:14px}
.sumg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sumg div{background:var(--paper);border-radius:10px;padding:10px;text-align:center}
.sumg b{display:block;font-family:var(--f-d);font-size:28px;color:var(--blue)}
.sumg span{font-size:12px;color:var(--body)}
.scr{max-height:none}
/* realistic wall totem */
.device{background:linear-gradient(160deg,#2A2D31,#121417 55%,#1B1D20);border-radius:34px;padding:18px 26px 22px;box-shadow:0 40px 70px -30px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.08),inset 0 -3px 0 rgba(0,0,0,.6);border:2px solid #050607;position:relative}
.device::before,.device::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#3A3E44;top:16px}

.dtop{display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 0 14px}
.dtop img{height:30px}.dtop .wm{height:16px}
.scr{background:linear-gradient(180deg,#14263A,#0D1B2A);color:#E9F0F7;border-radius:12px;border:3px solid #050607;box-shadow:inset 0 0 30px rgba(0,0,0,.5);min-height:560px}
.sbar{display:flex;justify-content:space-between;font-size:12px;color:#8FA8C0;border-bottom:1px solid #243A52;padding-bottom:6px}

.scr .mic{color:#9DB2C7}

.scr .ttab[aria-selected="true"]{background:#24476B;color:#fff}
.scr .pickc{background:#1A2E44;border-color:#2A4560;border-left-color:var(--orange);color:#E9F0F7}
.scr .pickc b{color:#fff}
.scr .pickc small{color:#9DB2C7}

.scr .heard{border-color:#2E4A66;background:#10202F;color:#E9F0F7}

.scr .big{border-radius:10px}
.scr .speak{background:#10202F;border-color:#2A4560}

.scr .chip{background:#1A2E44;border-color:#2E4A66;color:#E9F0F7}
.scr .extbox{border-color:#2A4560;background:#10202F}
.scr .mini th{background:#1A2E44;color:#C8D7E6}
.scr .mini td{border-top-color:#22384E;color:#E9F0F7}
.scr .exttot{color:#7FB6EA}
.scr .tmap .ty{background:#24476B}
.scr .front{background:#1A2E44;color:#9DB2C7}
.scr .sumg div{background:#1A2E44}
.scr .sumg b{color:#fff}
.scr .sumg span{color:#9DB2C7}
.scr .prog{background:#22384E}
.scr .req{background:#173A2A;color:#A8E2C2}
.scr .req.buy{background:#3D2A10;color:#FFD08A}
.login{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 10px}
.login .lt{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700}
.login h2{font-family:var(--f-d);font-size:40px;color:#fff}
.nfc{position:relative;width:120px;height:120px;margin:10px 0}
.nfc span{position:absolute;inset:0;border:3px solid var(--orange);border-radius:50%;opacity:0;animation:nfc 2.4s ease-out infinite}
.nfc span:nth-child(2){animation-delay:.8s}.nfc span:nth-child(3){animation-delay:1.6s}
@keyframes nfc{0%{transform:scale(.3);opacity:1}100%{transform:scale(1);opacity:0}}
.dbot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px}
.reader{flex:1;max-width:230px;background:#0B0C0E;border:1px solid #3A3E44;border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#C8CDD3}
.reader .waves{font-size:20px;letter-spacing:-2px;transform:rotate(0deg);color:#C8CDD3}
.reader small{font-size:12px}
.reader.ok{border-color:var(--green)}
.reader.ok .waves{color:#6BD39A}
.micdev{display:flex;flex-direction:column;align-items:center;gap:6px;margin-right:30px}
.micdev .capsule{width:14px;height:30px;border-radius:7px;background:#050607;border:1px solid #3A3E44}
.micdev .led{width:8px;height:8px;border-radius:50%;background:#5A3A10}
.micdev.live .led{background:var(--orange);box-shadow:0 0 10px var(--orange);animation:pulse 1.2s infinite}
.micdev small{font-size:11px;color:#8A9097}
@media (max-width:1000px){.gridtv,.totemlay,.drawer,.vs{grid-template-columns:1fr}.osgrid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.osgrid{grid-template-columns:1fr}.brand b{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      var s = c.steps[t.si], body = '', btns = '';
      if (s.k === 'group' || s.k === 'fm14') {
        var opts = s.k === 'fm14' ? ['Conforme', 'Não conforme', 'N/A'] : ['SIM', 'NÃO'];
        body = '<ul class="tlist">' + s.items.map(function (it) {
          var key = t.si + ':' + (s.k === 'fm14' ? it[1] + it[2] : it[0]), r = t.res[key];
          return '<li><span><b class="code">' + esc(s.k === 'fm14' ? it[1] : it[0]) + '</b>' + esc(s.k === 'fm14' ? it[0] + ' · ' + it[2] : it[1]) + '</span><span class="seg">' + opts.map(function (o) { return '<button class="sbtn' + (r === o ? ' on ' + (o === 'NÃO' || o === 'Não conforme' ? 'bad' : 'good') : '') + '" data-set="' + esc(key) + '" data-val="' + o + '">' + (o === 'Não conforme' ? 'NC' : o === 'Conforme' ? 'C' : o) + '</button>'; }).join('') + '</span></li>';
        }).join('') + '</ul>';
        btns = '<button class="big b-ok" id="allok">' + (s.k === 'fm14' ? 'Tudo conforme' : 'Tudo SIM') + '</button><button class="big b-mic" id="talk">🎙 Falar</button><button class="big b-blue" id="next">Próxima etapa →</button>';
      } else if (s.k === 'open') {
        body = '<div class="heard"><small>Ouvido</small>' + (t.res[t.si + ':open'] ? '“' + esc(t.res[t.si + ':open']) + '”' : '<span class="muted">aguardando a fala do mecânico…</span>') + '</div>';
        btns = '<button class="big b-mic" id="talk">🎙 Falar</button><button class="big b-blue" id="next">Próxima etapa →</button>';
      } else if (s.k === 'tyres') {
        body = tyreMap(c.plate, t.tyresOk);
        btns = '<button class="big b-ok" id="tyok">Mapa conferido</button><button class="big b-mic" id="talk">🎙 Falar</button><button class="big b-blue" id="next">Próxima etapa →</button>';
      } else if (s.k === 'ext') {
        body = extBlock(c);
        btns = '<button class="big b-ok" id="extok">Serviço conferido</button><button class="big b-mic" id="talk">🎙 Falar</button><button class="big b-blue" id="next">Próxima etapa →</button>';
      }
      scr = '<div class="hd"><b>' + esc(c.plate) + ' · OS ' + esc(c.os) + '</b><span class="mic on"><i></i>Ouvindo</span></div>' +
        '<p class="meta">' + (S.tab === 'prev' ? 'Preventiva' : 'Corretiva') + ' · iniciada às ' + hm(t.start) + '</p><div class="prog"><i style="width:' + (t.si / c.steps.length * 100) + '%"></i></div>' +
        '<div class="qcard"><small>ETAPA ' + (t.si + 1) + ' DE ' + c.steps.length + (s.items ? ' · ' + s.items.length + ' ITENS' : '') + '</small><h2>' + esc(s.t) + '</h2></div>' +
        (t.heard ? '<div class="heard"><small>Ouvido</small>“' + esc(t.heard) + '”</div>' : '') +
        (t.pending ? t.pending.map(function (p) { return '<div class="req' + (p.part.stock ? '' : ' buy') + '">→ Almoxarifado: ' + p.qty + '× ' + esc(p.part.name) + ' · ' + (p.part.stock ? 'em estoque, prateleira ' + p.part.loc : 'sem estoque, vai para compra') + '</div>'; }).join('') : '') +
        '<div class="tbody">' + body + '</div>' +
        (t.talk ? '<div class="speak"><span class="meta">Simulação da fala: toque numa frase ou digite o que o mecânico diria.</span><div class="chips">' + (s.say || []).map(function (x) { return '<button class="chip" data-say="' + esc(x) + '">“' + esc(x) + '”</button>'; }).join('') + '</div><input id="free" placeholder="Ex.: tudo ok, lonas do eixo 2 gastas, preciso de quatro lonas" autocomplete="off"><button class="big b-blue" id="sayfree">Enviar fala</button></div>' : '') +
        '<div class="btnrow">' + btns + '</div><p class="meta">Diga “próxima” para seguir · “finalizei OS” para revisar</p>';
    } else {
      var open = S.reqs.filter(function (r) { return r.os === c.os && r.st !== 'ent'; });
      var pend = Object.keys(t.res).filter(function (k) { return t.res[k] === 'NÃO' || t.res[k] === 'Não conforme'; }).length;
      scr = '<div class="hd"><b>REVISÃO · ' + esc(c.plate) + '</b><span class="mic"><i></i>Pausado</span></div><p class="meta">“Finalizei OS”. Confira a OS completa ao lado antes de enviar.</p>' +
        '<div class="sumg"><div><b>' + Object.keys(t.res).length + '</b><span>respostas</span></div><div><b>' + pend + '</b><span>itens não OK</span></div><div><b>' + S.reqs.filter(function (r) { return r.os === c.os; }).length + '</b><span>pedidos de peça</span></div><div><b>' + (S.now - t.start) + ' min</b><span>de execução</span></div></div>' +
        (open.length ? '<div class="req buy">' + open.length + ' pedido(s) de peça ainda não entregue(s). Se enviar agora, seguem abertos no almoxarifado.</div>' : '') +
        '<div class="btnrow"><button class="big b-ghost" id="back">Voltar à última etapa</button><button class="big b-ok" id="send">Enviar OS</button></div>';
    }
    var right = c ? '<div class="explain"><p class="meta"><b>OS completa, ao vivo.</b> Tudo o que hoje vai no papel: a OS do Rodopar, os itens, o mapa de pneus e a OS da oficina externa. Em azul, o que o Hub preenche sozinho.</p>' + osPanel(c, t) + '</div>'
      : '<div class="explain"><div class="card"><h3>Como funciona</h3><ul><li>Escolha a aba <b>Preventiva</b> ou <b>Corretiva</b> e a OS.</li><li>O mecânico usa um microfone sem fio: aqui você simula o que ele fala, ou toca nas respostas.</li><li>Os itens vêm agrupados por sistema. “Tudo SIM” resolve o bloco; a fala marca as exceções e pede as peças.</li><li>Ao lado aparece a OS completa, com todos os campos e anexos.</li></ul></div>' +
        '<div class="card"><h3>As OS deste protótipo</h3><ul><li>106470 · TDQ-5E09 · revisão na Via Trucks (OS 68513) + reinspeção + pneus</li><li>106115 · QUS-1478 · revisão 60.000 km: ' + itemCount(CASES.prev[1]) + ' itens, FM MAN 14 e pneus</li><li>106510 · RNW-6C98 · revisão na JTM Diesel (OS 001766, R$ 9.635,60) + pneus</li><li>106027 · RNW-6C98 · corretiva de direção e suspensão</li><li>86487 · TDQ-5E09 · S.O.S na estrada</li></ul></div>' +
        '<div class="card"><h3>Privacidade</h3><p>O microfone só escuta entre “iniciei OS” e “finalizei OS”, tem botão de pausa e nunca é usado para avaliar o mecânico.</p></div></div>';
    el.innerHTML = '<p class="hint">Totem do box: escolha <b>Preventiva</b> ou <b>Corretiva</b>, depois a OS. A OS se preenche conforme o mecânico fala.</p><div class="totemlay"><div class="device"><div class="dtop"><img src="' + document.querySelector('.brand .sym').src + '" alt=""><img class="wm" src="' + document.querySelector('.brand .wm').src + '" alt="Transpedrosa"></div><div class="scr"><div class="sbar"><span>' + (S.badge ? '👤 ' + S.badge + ' · Box 2' : 'Box 2') + '</span><span>' + hm(S.now) + '</span></div>' + scr + '</div><div class="dbot"><button class="reader' + (S.badge ? ' ok' : '') + '" id="badge2" aria-label="Leitor de crachá"><span class="waves">)))</span><small>' + (S.badge ? 'Crachá lido' : 'Aproxime seu crachá') + '</small></button><div class="micdev' + (t && t.stage === 'steps' ? ' live' : '') + '"><i class="capsule"></i><i class="led"></i><small>' + (t && t.stage === 'steps' ? 'ouvindo' : 'microfone') + '</small></div></div></div>' + right + '</div>';
  }

  function pickCase(id) {
    var c = caseById(id);
    S.t = { cid: id, stage: 'ready', si: 0, res: {}, notes: [], heard: '', pending: null, talk: false, start: null, end: null, tyresOk: false };
    if (c.job) S.sel = c.job;
  }
  function startOS() {
    var t = S.t, c = caseById(t.cid);
    t.stage = 'steps'; t.start = S.now;
    if (c.job) { var j = job(c.job); j.st = 'svc'; j.from = S.now; j.life.push([hm(S.now), '“Iniciei OS” no totem: relógio de execução começa']); }
    tick(3);
  }
  function addReqs(c, text) {
    var j = c.job ? job(c.job) : null, parts = text && needsPart(text) ? parseParts(text) : [];
    parts.forEach(function (p) {
      var r = { id: 'R' + (14900 + S.reqs.length), os: c.os, plate: c.plate, part: p.part, qty: p.qty, st: p.part.stock ? 'pend' : 'buy', t: hm(S.now), eta: p.part.stock ? '' : 'amanhã 10:00' };
      S.reqs.push(r);
      if (j) j.life.push([hm(S.now), 'Pedido ' + r.id + ': ' + p.qty + '× ' + p.part.name + (p.part.stock ? ' (em estoque)' : ' (compra)')]);
    });
    S.t.pending = parts.length ? parts : null;
    if (j) j.st = S.reqs.some(function (r) { return r.os === c.os && r.st !== 'ent'; }) ? 'wait' : 'svc';
  }
  function say(text) {
    var t = S.t, c = caseById(t.cid), s = c.steps[t.si];
    t.heard = text; t.talk = false; t.notes.push(s.t + ': ' + text);
    if (s.k === 'group' || s.k === 'fm14') {
      var bad = isBad(text);
      s.items.forEach(function (it) {
        var key = t.si + ':' + (s.k === 'fm14' ? it[1] + it[2] : it[0]);
        var isBadItem = bad && s.bad && s.bad.indexOf(it[0]) >= 0;
        t.res[key] = isBadItem ? 'NÃO' : (s.k === 'fm14' ? 'Conforme' : 'SIM');
      });
    } else if (s.k === 'open') t.res[t.si + ':open'] = text;
    else if (s.k === 'tyres') t.tyresOk = true;
    else if (s.k === 'ext') t.res[t.si + ':ext'] = 'Conferido';
    addReqs(c, text);
    tick(5);
  }
  function nextStep() {
    var t = S.t, c = caseById(t.cid);
    t.heard = ''; t.pending = null; t.talk = false;
    if (t.si < c.steps.length - 1) t.si++; else t.stage = 'review';
    tick(2);
  }
  function sendOS() {
    var t = S.t, c = caseById(t.cid);
    t.end = S.now; t.stage = 'sent';
    if (c.job) { var j = job(c.job); j.st = 'done'; j.to = S.now; j.life.push([hm(S.now), '“Finalizei OS”, revisada e enviada · caminhão liberado']); }
    S.sent.push({ c: c, t: JSON.parse(JSON.stringify(t)) });
    tick(2);
  }

  function renderAlmox() {
    var el = document.getElementById('v-almox');
    var rows = S.reqs.map(function (r) {
      var pill = { pend: '<span class="pill p-pend">Novo pedido</span>', sep: '<span class="pill p-sep">Separado</span>', ent: '<span class="pill p-ent">Entregue</span>', buy: '<span class="pill p-buy">Compra · prev. ' + esc(r.eta) + '</span>' }[r.st];
      var btn = r.st === 'pend' ? '<button class="act" data-adv="' + r.id + '">Separar</button>' : r.st === 'sep' ? '<button class="act" data-adv="' + r.id + '">Entregar no box</button>' : r.st === 'buy' ? '<button class="act" data-adv="' + r.id + '">Nota fiscal chegou</button>' : '—';
      return '<tr><td><b>' + r.id + '</b><br><small>' + r.t + '</small></td><td>OS ' + r.os + '<br><small>' + esc(r.plate) + '</small></td><td>' + r.qty + '× ' + esc(r.part.name) + '<br><small>cód. ' + r.part.code + ' · prateleira ' + r.part.loc + ' · estoque ' + r.part.stock + '</small></td><td>' + pill + '</td><td>' + btn + '</td></tr>';
    }).join('');
    el.innerHTML = '<p class="hint">Fila do almoxarifado. Todo pedido já nasce ligado a uma OS e a uma placa. Quando a peça é entregue, o relógio de espera do caminhão para e a tela grande muda sozinha.</p>' +
      '<h1 style="margin-bottom:12px">Pedidos de peça da oficina</h1><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Requisição</th><th>OS / placa</th><th>Peça</th><th>Situação</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="vs"><div class="card old"><h3>Hoje: um pedido emergencial passa por 3 lugares</h3><ul><li>Requisição no Rodopar (Materiais › Requisição de compras)</li><li>Planilha online “Controle de requisições compra emergencial”</li><li>Mensagem no grupo de WhatsApp “Requisições OS Filiais”</li><li>Na OS de papel, os códigos das peças são anotados à mão</li></ul></div><div class="card new"><h3>Com o Hub: um lugar só</h3><ul><li>O pedido sai da fala do mecânico, já com OS, placa e código da peça</li><li>A requisição é gravada no Rodopar pela integração</li><li>Quem precisa saber vê na fila e na tela grande, sem mensagem</li></ul></div></div>';
  }
  function advanceReq(id) {
    var r = S.reqs.filter(function (x) { return x.id === id; })[0];
    var j = S.jobs.filter(function (x) { return x.plate === r.plate && x.os === r.os; })[0];
    if (r.st === 'pend') { r.st = 'sep'; if (j) j.life.push([hm(S.now), 'Almoxarifado separou ' + r.part.name]); }
    else { r.st = 'ent'; if (j) j.life.push([hm(S.now), 'Peça entregue no box: ' + r.part.name + ' · espera encerrada']); }
    if (j && j.st === 'wait' && !S.reqs.some(function (x) { return x.os === j.os && x.st !== 'ent'; })) j.st = 'svc';
    tick(4); render();
  }

  function renderRodo() {
    var el = document.getElementById('v-rodo');
    if (!S.sent.length) { el.innerHTML = '<div class="empty-state"><h2>Nenhuma OS enviada ainda</h2><p style="margin-top:8px">Faça uma OS preventiva ou corretiva no <b>Totem do box</b> e envie. Ela aparece aqui como chega ao Rodopar.</p><div class="btnrow" style="justify-content:center;margin-top:14px"><button class="big b-mic" data-go="totem" style="flex:0 1 260px">Ir para o totem</button></div></div>'; return; }
    var last = S.sent[S.sent.length - 1];
    el.innerHTML = '<p class="hint">É assim que a OS chega ao Rodopar: os mesmos campos da OS impressa, com itens, pneus e anexos. Em azul, o que o Hub preencheu sozinho.</p>' +
      (S.sent.length > 1 ? '<p class="meta" style="margin-bottom:10px">OS enviadas: ' + S.sent.map(function (s) { return s.c.os + ' (' + s.c.plate + ')'; }).join(' · ') + '. Mostrando a última.</p>' : '') +
      osPanel(last.c, last.t, true) +
      '<div class="vs"><div class="card old"><h3>Hoje, no papel</h3><ul><li>“Cheg. oficina” e “Saída oficina” em branco ou escritos à mão</li><li>Motorista: “A INFORMAR”</li><li>“Serviços realizados” em branco; peças anotadas à mão</li><li>Mapa de pneus e OS da oficina externa em folhas separadas</li><li>Previsão de entrega igual à hora de abertura em 96,7% das OS</li></ul></div><div class="card new"><h3>Com o Hub</h3><ul><li>Chegada, início e saída gravados no momento em que acontecem</li><li>Serviços realizados e peças vêm da fala do mecânico</li><li>Pneus e documentos externos ficam na mesma OS</li><li>Classificação e conjunto corretos, para medir planejada × não planejada</li></ul></div></div>';
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.v) return show(b.dataset.v);
    if (b.dataset.go) return show(b.dataset.go);
    if (b.dataset.job) { S.sel = S.sel === b.dataset.job ? null : b.dataset.job; return render(); }
    if (b.dataset.adv) return advanceReq(b.dataset.adv);
    if (b.dataset.ttab) { if (S.t && S.t.stage !== 'sent' && S.t.stage !== 'ready') return; S.tab = b.dataset.ttab; S.t = null; return render(); }
    if (b.dataset.case) { pickCase(b.dataset.case); return render(); }
    if (b.dataset.set) { S.t.res[b.dataset.set] = b.dataset.val; return render(); }
    if (b.dataset.say) { say(b.dataset.say); return render(); }
    if (b.id === 'badge' || (b.id === 'badge2' && !S.badge)) { S.badge = 'Mecânico B'; tick(1); return render(); }
    if (b.id === 'reset') { S = initial(); document.getElementById('clk').textContent = hm(S.now); return show('tv'); }
    if (b.id === 'start') { startOS(); return render(); }
    if (b.id === 'cancel') { S.t = null; return render(); }
    if (b.id === 'allok') { var t = S.t, s = caseById(t.cid).steps[t.si]; s.items.forEach(function (it) { var k = t.si + ':' + (s.k === 'fm14' ? it[1] + it[2] : it[0]); if (!t.res[k]) t.res[k] = s.k === 'fm14' ? 'Conforme' : 'SIM'; }); tick(2); return render(); }
    if (b.id === 'tyok') { S.t.tyresOk = true; S.t.notes.push('Mapa de pneus conferido'); tick(3); return render(); }
    if (b.id === 'extok') { S.t.res[S.t.si + ':ext'] = 'Conferido'; S.t.notes.push('Serviço da oficina externa conferido e aprovado na reinspeção'); tick(3); return render(); }
    if (b.id === 'next') { nextStep(); return render(); }
    if (b.id === 'talk') { S.t.talk = !S.t.talk; render(); var inp = document.getElementById('free'); if (inp) inp.focus(); return; }
    if (b.id === 'sayfree') { var v = (document.getElementById('free').value || '').trim(); if (v) { say(v); render(); } return; }
    if (b.id === 'back') { S.t.stage = 'steps'; S.t.si = caseById(S.t.cid).steps.length - 1; return render(); }
    if (b.id === 'send') { sendOS(); return render(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'free') document.getElementById('sayfree').click(); });

  S = initial();
  var h = (location.hash || '').slice(1);
  show(['tv', 'totem', 'almox', 'rodo'].indexOf(h) >= 0 ? h : 'tv');
  setInterval(function () { if (S.view === 'tv') { tick(1); renderTV(); } }, 20000);
})();
</script>

</body></html>
